[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alex-fin-research"
version = "0.1.0"
description = "Alex-Fin portfolio research source and bilingual learning cases"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "pandas>=2.2",
  "scipy>=1.11",
  "torch>=2.2",
  "scikit-learn>=1.4",
  "pyarrow>=10",
  "loguru>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/Soros2040/Alex-Fin"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
